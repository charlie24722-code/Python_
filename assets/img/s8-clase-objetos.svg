<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-label="Una clase CuentaBancaria funciona como molde con atributos y métodos; de ella se crean tres objetos, cada uno con su propio titular y saldo.">
<title>Una clase CuentaBancaria funciona como molde con atributos y métodos; de ella se crean tres objetos, cada uno con su propio titular y saldo.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<rect x="20" y="30" width="240" height="210" rx="10" fill="#e2ecf1" stroke="#1d4f66" stroke-width="1.5"/>
<text x="140" y="56" text-anchor="middle" class="m b">class CuentaBancaria</text>
<text x="140" y="78" text-anchor="middle" class="s">(el molde)</text>
<path d="M36 90 H244" stroke="#1d4f66"/>
<text x="140" y="112" text-anchor="middle" class="s b">atributos:</text>
<text x="140" y="132" text-anchor="middle" class="m s">titular, saldo</text>
<text x="140" y="168" text-anchor="middle" class="s b">métodos:</text>
<text x="140" y="188" text-anchor="middle" class="m s">depositar(monto)</text>
<text x="140" y="208" text-anchor="middle" class="m s">retirar(monto)</text>
<path class="ln" d="M262 135 C340 135 360 54 436 54" marker-end="url(#p)"/>
<rect x="440" y="20" width="300" height="66" rx="10" fill="#fff" stroke="#b07600" stroke-width="2"/>
<text x="590" y="44" text-anchor="middle" class="m b">cuenta_ana</text>
<text x="590" y="68" text-anchor="middle" class="m s">titular = "Ana"   saldo = 150.00</text>
<path class="ln" d="M262 135 C340 135 360 132 436 132" marker-end="url(#p)"/>
<rect x="440" y="98" width="300" height="66" rx="10" fill="#fff" stroke="#b07600" stroke-width="2"/>
<text x="590" y="122" text-anchor="middle" class="m b">cuenta_luis</text>
<text x="590" y="146" text-anchor="middle" class="m s">titular = "Luis"   saldo = 0.00</text>
<path class="ln" d="M262 135 C340 135 360 210 436 210" marker-end="url(#p)"/>
<rect x="440" y="176" width="300" height="66" rx="10" fill="#fff" stroke="#b07600" stroke-width="2"/>
<text x="590" y="200" text-anchor="middle" class="m b">cuenta_eva</text>
<text x="590" y="224" text-anchor="middle" class="m s">titular = "Eva"   saldo = 2300.00</text>
<text x="350" y="266" text-anchor="middle" class="s">Un molde, muchos objetos: cada objeto (instancia) guarda sus propios datos.</text>
</svg>
