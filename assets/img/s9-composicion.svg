<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-label="Composición: una Factura tiene un Cliente y varias LineaFactura; su método total suma los subtotales de sus líneas.">
<title>Composición: una Factura tiene un Cliente y varias LineaFactura; su método total suma los subtotales de sus líneas.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<rect x="20" y="20" width="720" height="210" rx="12" fill="#e2ecf1" stroke="#1d4f66" stroke-width="1.5"/>
<text x="70" y="48" text-anchor="start" class="t">Factura</text>
<text x="150" y="48" text-anchor="start" class="m s">numero, fecha, total()</text>
<rect x="44" y="66" width="200" height="60" rx="8" fill="#fff" stroke="#b07600" stroke-width="2"/>
<text x="144" y="90" text-anchor="middle" class="b">Cliente</text>
<text x="144" y="110" text-anchor="middle" class="m s">nombre, nit</text>
<rect x="270" y="66" width="136" height="60" rx="8" fill="#fff" stroke="#0a70a8" stroke-width="2"/>
<text x="338" y="90" text-anchor="middle" class="b">LineaFactura</text>
<text x="338" y="110" text-anchor="middle" class="m s">producto, cant.</text>
<rect x="420" y="66" width="136" height="60" rx="8" fill="#fff" stroke="#0a70a8" stroke-width="2"/>
<text x="488" y="90" text-anchor="middle" class="b">LineaFactura</text>
<text x="488" y="110" text-anchor="middle" class="m s">producto, cant.</text>
<rect x="570" y="66" width="136" height="60" rx="8" fill="#fff" stroke="#0a70a8" stroke-width="2"/>
<text x="638" y="90" text-anchor="middle" class="b">LineaFactura</text>
<text x="638" y="110" text-anchor="middle" class="m s">producto, cant.</text>
<text x="144" y="150" text-anchor="middle" class="s b">tiene un</text>
<text x="495" y="150" text-anchor="middle" class="s b">tiene varias (lista)</text>
<rect x="44" y="166" width="672" height="46" rx="6" fill="#fbf1b8" stroke="none" stroke-width="1.5"/>
<text x="380" y="194" text-anchor="middle" class="s">total() recorre sus líneas y suma cada subtotal: la Factura delega en los objetos que contiene.</text>
<text x="380" y="256" text-anchor="middle" class="s b">Composición = “tiene un”. Herencia = “es un”. Una factura no ES un cliente: TIENE un cliente.</text>
</svg>
