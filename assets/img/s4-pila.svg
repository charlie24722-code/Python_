<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" width="800" height="302" role="img" aria-label="Pila de llamadas de valor_futuro: la llamada con 3 años llama a la de 2, 1 y 0; la de 0 es el caso base y devuelve 1000, y las respuestas regresan como 1100, 1210 y 1331.">
<title>Pila de llamadas de valor_futuro: la llamada con 3 años llama a la de 2, 1 y 0; la de 0 es el caso base y devuelve 1000, y las respuestas regresan como 1100, 1210 y 1331.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<rect x="60" y="30" width="330" height="46" rx="6" fill="#e2ecf1" stroke="#1d4f66" stroke-width="1.5"/>
<text x="74" y="59" text-anchor="start" class="m">valor_futuro(1000, 0.10, anios=3)</text>
<path class="ln" d="M100 76 V92" marker-end="url(#p)"/>
<path class="ln" d="M560 53 H398" marker-end="url(#pg)" stroke="#2e7d4f" stroke-width="2"/>
<text x="575" y="58" text-anchor="start" class="m b" style="fill:#2e7d4f">devuelve 1331.0</text>
<rect x="100" y="92" width="330" height="46" rx="6" fill="#e2ecf1" stroke="#1d4f66" stroke-width="1.5"/>
<text x="114" y="121" text-anchor="start" class="m">valor_futuro(1000, 0.10, anios=2)</text>
<path class="ln" d="M140 138 V154" marker-end="url(#p)"/>
<path class="ln" d="M570 115 H438" marker-end="url(#pg)" stroke="#2e7d4f" stroke-width="2"/>
<text x="585" y="120" text-anchor="start" class="m b" style="fill:#2e7d4f">devuelve 1210.0</text>
<rect x="140" y="154" width="330" height="46" rx="6" fill="#e2ecf1" stroke="#1d4f66" stroke-width="1.5"/>
<text x="154" y="183" text-anchor="start" class="m">valor_futuro(1000, 0.10, anios=1)</text>
<path class="ln" d="M180 200 V216" marker-end="url(#p)"/>
<path class="ln" d="M580 177 H478" marker-end="url(#pg)" stroke="#2e7d4f" stroke-width="2"/>
<text x="595" y="182" text-anchor="start" class="m b" style="fill:#2e7d4f">devuelve 1100.0</text>
<rect x="180" y="216" width="330" height="46" rx="6" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="194" y="245" text-anchor="start" class="m">valor_futuro(1000, 0.10, anios=0)</text>
<path class="ln" d="M590 239 H518" marker-end="url(#pg)" stroke="#2e7d4f" stroke-width="2"/>
<text x="605" y="244" text-anchor="start" class="m b" style="fill:#2e7d4f">devuelve 1000</text>
<text x="24" y="20" text-anchor="start" class="s b">llama →</text>
<text x="210" y="290" text-anchor="middle" class="s b" style="fill:#b07600">caso base: responde sin llamarse</text>
<text x="650" y="290" text-anchor="middle" class="s b" style="fill:#2e7d4f">las respuestas suben ×1.10</text>
</svg>
