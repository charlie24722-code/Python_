<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-label="Encapsulamiento: el saldo interno está protegido y el código externo lo modifica solo a través de los métodos depositar y retirar, que validan las reglas; asignar directamente el atributo interno se salta esas reglas.">
<title>Encapsulamiento: el saldo interno está protegido y el código externo lo modifica solo a través de los métodos depositar y retirar, que validan las reglas; asignar directamente el atributo interno se salta esas reglas.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<circle cx="380" cy="125" r="100" fill="#e2ecf1" stroke="#1d4f66" stroke-width="2"/>
<rect x="320" y="105" width="120" height="40" rx="6" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="380" y="130" text-anchor="middle" class="m b">self._saldo</text>
<text x="380" y="168" text-anchor="middle" class="s">estado interno</text>
<rect x="320" y="20" width="120" height="30" rx="15" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="380" y="40" text-anchor="middle" class="m w b">depositar()</text>
<rect x="455" y="180" width="110" height="30" rx="15" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="510" y="200" text-anchor="middle" class="m w b">retirar()</text>
<rect x="185" y="180" width="120" height="30" rx="15" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="245" y="200" text-anchor="middle" class="m w b">.saldo (leer)</text>
<text x="120" y="60" text-anchor="middle" class="b">código de afuera</text>
<path class="ln" d="M160 70 C220 80 280 40 318 36" marker-end="url(#pg)" stroke="#2e7d4f"/>
<text x="120" y="80" text-anchor="middle" class="s" style="fill:#2e7d4f">usa los métodos ✓</text>
<text x="650" y="60" text-anchor="middle" class="m b" style="fill:#b8402f">cuenta._saldo = -500</text>
<path d="M620 72 C560 90 470 100 444 118" stroke="#b8402f" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<text x="650" y="80" text-anchor="middle" class="s" style="fill:#b8402f">saltarse las reglas ✗</text>
<text x="380" y="250" text-anchor="middle" class="s">Los métodos validan (no retirar más que el saldo); el guion bajo dice “no tocar desde afuera”.</text>
</svg>
