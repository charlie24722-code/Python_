<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-label="Comparación entre una tupla, donde el stock se lee como p[3], y un diccionario, donde se lee como producto[&quot;stock&quot;]: cada clave apunta a su valor.">
<title>Comparación entre una tupla, donde el stock se lee como p[3], y un diccionario, donde se lee como producto["stock"]: cada clave apunta a su valor.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<text x="190" y="24" text-anchor="middle" class="b">Tupla: el dato se busca por posición</text>
<rect x="30" y="44" width="76" height="40" rx="4" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="68" y="69" text-anchor="middle" class="m">"A01"</text>
<text x="68" y="100" text-anchor="middle" class="m s">p[0]</text>
<rect x="114" y="44" width="76" height="40" rx="4" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="152" y="69" text-anchor="middle" class="m">"Aceite"</text>
<text x="152" y="100" text-anchor="middle" class="m s">p[1]</text>
<rect x="198" y="44" width="76" height="40" rx="4" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="236" y="69" text-anchor="middle" class="m">12.50</text>
<text x="236" y="100" text-anchor="middle" class="m s">p[2]</text>
<rect x="282" y="44" width="76" height="40" rx="4" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="320" y="69" text-anchor="middle" class="m">40</text>
<text x="320" y="100" text-anchor="middle" class="m s">p[3]</text>
<text x="190" y="128" text-anchor="middle" class="s" style="fill:#b8402f">¿p[3] era el stock o el precio? Hay que recordarlo.</text>
<path d="M380 30 V240" stroke="#c5ced6"/>
<text x="575" y="24" text-anchor="middle" class="b">Diccionario: el dato se busca por nombre</text>
<rect x="410" y="44" width="120" height="34" rx="17" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="470" y="66" text-anchor="middle" class="m w b">"codigo"</text>
<path class="ln" d="M532 61 H588" marker-end="url(#p)"/>
<rect x="592" y="44" width="150" height="34" rx="4" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="667" y="66" text-anchor="middle" class="m">"A01"</text>
<rect x="410" y="90" width="120" height="34" rx="17" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="470" y="112" text-anchor="middle" class="m w b">"nombre"</text>
<path class="ln" d="M532 107 H588" marker-end="url(#p)"/>
<rect x="592" y="90" width="150" height="34" rx="4" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="667" y="112" text-anchor="middle" class="m">"Aceite 1 L"</text>
<rect x="410" y="136" width="120" height="34" rx="17" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="470" y="158" text-anchor="middle" class="m w b">"precio"</text>
<path class="ln" d="M532 153 H588" marker-end="url(#p)"/>
<rect x="592" y="136" width="150" height="34" rx="4" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="667" y="158" text-anchor="middle" class="m">12.50</text>
<rect x="410" y="182" width="120" height="34" rx="17" fill="#1d4f66" stroke="none" stroke-width="1.5"/>
<text x="470" y="204" text-anchor="middle" class="m w b">"stock"</text>
<path class="ln" d="M532 199 H588" marker-end="url(#p)"/>
<rect x="592" y="182" width="150" height="34" rx="4" fill="#fbf1b8" stroke="#b07600" stroke-width="1.5"/>
<text x="667" y="204" text-anchor="middle" class="m">40</text>
<text x="575" y="240" text-anchor="middle" class="s" style="fill:#2e7d4f">producto["stock"] se lee solo</text>
</svg>
