<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Ruta de las 12 semanas del ciclo con controles en las semanas 2, 5, 8 y 11, parcial en la 6, final en la 12 y fases del proyecto en las semanas 1, 3, 5, 7, 9, 10 y 11.">
<title>Ruta de las 12 semanas del ciclo con controles en las semanas 2, 5, 8 y 11, parcial en la 6, final en la 12 y fases del proyecto en las semanas 1, 3, 5, 7, 9, 10 y 11.</title>
