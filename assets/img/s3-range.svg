<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="760" height="172" role="img" aria-label="range(1, 6) incluye los números del 1 al 5: el inicio se incluye y el fin no.">
<title>range(1, 6) incluye los números del 1 al 5: el inicio se incluye y el fin no.</title>
<style>
  text { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #1b2430; }
  .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; }
  .s { font-size: 12px; fill: #465264; }
  .t { font-size: 16px; font-weight: 700; }
  .b { font-weight: 700; }
  .mu { fill: #6b7380; }
  .w { fill: #fff; }
  .ln { stroke: #465264; stroke-width: 1.6; fill: none; }
  .ln-s { stroke: #c5ced6; stroke-width: 1.2; fill: none; }
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#465264"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a70a8"/></marker><marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker></defs>
<text x="380" y="28" text-anchor="middle" class="t">range(1, 6) produce 1, 2, 3, 4, 5</text>
<rect x="60" y="58" width="60" height="48" rx="6" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="90" y="89" text-anchor="middle" class="m mu">0</text>
<rect x="144" y="58" width="60" height="48" rx="6" fill="#1d4f66" stroke="#1d4f66" stroke-width="1.5"/>
<text x="174" y="89" text-anchor="middle" class="m b w">1</text>
<rect x="228" y="58" width="60" height="48" rx="6" fill="#1d4f66" stroke="#1d4f66" stroke-width="1.5"/>
<text x="258" y="89" text-anchor="middle" class="m b w">2</text>
<rect x="312" y="58" width="60" height="48" rx="6" fill="#1d4f66" stroke="#1d4f66" stroke-width="1.5"/>
<text x="342" y="89" text-anchor="middle" class="m b w">3</text>
<rect x="396" y="58" width="60" height="48" rx="6" fill="#1d4f66" stroke="#1d4f66" stroke-width="1.5"/>
<text x="426" y="89" text-anchor="middle" class="m b w">4</text>
<rect x="480" y="58" width="60" height="48" rx="6" fill="#1d4f66" stroke="#1d4f66" stroke-width="1.5"/>
<text x="510" y="89" text-anchor="middle" class="m b w">5</text>
<rect x="564" y="58" width="60" height="48" rx="6" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="594" y="89" text-anchor="middle" class="m mu" style="fill:#b8402f">6</text>
<rect x="648" y="58" width="60" height="48" rx="6" fill="#fff" stroke="#c5ced6" stroke-width="1.5"/>
<text x="678" y="89" text-anchor="middle" class="m mu">7</text>
<text x="174" y="128" text-anchor="middle" class="s b" style="fill:#2e7d4f">inicio: sí se incluye</text>
<text x="594" y="128" text-anchor="middle" class="s b" style="fill:#b8402f">fin: NO se incluye</text>
<path d="M564 58 L624 106 M624 58 L564 106" stroke="#b8402f" stroke-width="2"/>
<text x="380" y="158" text-anchor="middle" class="s">Cantidad de vueltas = fin − inicio = 6 − 1 = 5.  Para los 12 meses: range(1, 13).</text>
