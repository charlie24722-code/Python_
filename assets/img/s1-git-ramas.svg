<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 266" width="740" height="266" role="img" aria-label="Una rama feature sale del commit C2 de main, recibe los commits F1 y F2, y se integra de vuelta a main con un merge en el commit M.">
<title>Una rama feature sale del commit C2 de main, recibe los commits F1 y F2, y se integra de vuelta a main con un merge en el commit M.</title>
<style>
